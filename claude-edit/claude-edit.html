<title>Claude Edit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@900&display=swap">
<style>
/* Layout: the 9:16 video is the hero, the cue sheet of the cut sits beside it; one column on phones */
:root {
  --ink: #0b0a0e;
  --panel: #18131b;
  --line: #2c2430;
  --cream: #f7ecdc;
  --muted: #a89aa3;
  --clay: #d97757;
  --ember: #ff9459;
  --peach: #ffcfae;
  --display: "Unbounded", "Arial Black", sans-serif;
  --serif: "Instrument Serif", Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--ink); color: var(--cream); }
body {
  margin: 0;
  font: 14px/1.55 var(--mono);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 48px;
}
.wrap { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: clamp(28px, 5vw, 64px); align-items: start; }
.player {
  position: relative;
  height: min(86vh, 820px);
  aspect-ratio: 9 / 16;
  max-width: 100%;
  border-radius: 26px;
  overflow: hidden;
  background: #000;
  box-shadow: 0 0 0 1px var(--line), 0 60px 140px -60px rgba(217, 119, 87, .5);
}
video { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; }
.info { min-width: 0; padding-top: 8px; }
.eyebrow { margin: 0; font: 700 11px/1.4 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--clay); }
h1 { margin: 14px 0 0; font: 900 clamp(54px, 8.4vw, 108px)/.92 var(--display); letter-spacing: -.02em; }
h1 em { font: italic 400 .64em var(--serif); letter-spacing: 0; color: var(--peach); margin-left: .1em; }
.lead { margin: 18px 0 0; max-width: 36ch; font: italic 400 22px/1.35 var(--serif); color: #d9cbc0; }
.cuehead { margin: 34px 0 10px; font: 700 11px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.cues { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.cue button {
  width: 100%; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; align-items: baseline;
  padding: 11px 12px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer;
}
.cue .tc { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }
.cue .nm { font: 900 15px/1.2 var(--display); letter-spacing: .02em; }
.cue .nt { font-size: 12px; color: var(--muted); text-align: right; }
.cue button:hover .nm { color: var(--peach); }
.cue button[aria-current="true"] { background: var(--panel); }
.cue button[aria-current="true"] .nm { color: var(--ember); }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
@media (max-width: 760px) {
  body { padding-block: 16px 36px; }
  .wrap { grid-template-columns: minmax(0, 1fr); }
  .player { width: 100%; height: auto; }
  .cue .nt { display: none; }
}
</style>

<main class="wrap">
  <div class="player">
    <video id="v" src="edit-web.mp4" poster="poster.jpg" controls playsinline preload="metadata"></video>
  </div>
  <section class="info">
    <p class="eyebrow">Fan edit · 0:34 · 130 BPM · f-moll</p>
    <h1>Claude<em>edit</em></h1>
    <p class="lead">Grafika 3D liczona klatka po klatce w WebGL, phonkowa ścieżka zsyntetyzowana od zera i cięta pod każdy beat.</p>
    <p class="cuehead">Ścieżka montażu</p>
    <ol class="cues" id="cues"></ol>
  </section>
</main>

<script>
(() => {
  const B = 60 / 130;
  const SCENES = [
    [0, 'Intro', 'pytanie'], [8, 'Build', 'Claude myśli'], [12, 'Drop', 'odpowiedź'], [16, 'Kod', 'pisze, naprawia'],
    [20, 'Myśli', 'krok po kroku'], [24, 'Rozmowa', 'czarne dziury'], [28, 'Języki', '8 cięć w 2 s'], [32, 'Tworzy', 'cząsteczki'],
    [36, 'Break', 'Haiku, Sonnet, Opus'], [44, 'Drop 2', 'kalejdoskop'], [48, 'Cząsteczki', '60 000 punktów'],
    [52, 'Cechy', 'pomocny, uczciwy'], [56, 'Zapytaj', 'o wszystko'], [60, 'Orbita', 'pierścienie'], [64, 'Finał', 'tape stop'], [68, 'Outro', 'od Anthropic'],
  ].map(([b, name, note]) => ({ t: b * B, name, note }));
  const v = document.getElementById('v'), list = document.getElementById('cues');
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const btns = SCENES.map(s => {
    const li = document.createElement('li'), b = document.createElement('button');
    li.className = 'cue'; b.type = 'button';
    b.innerHTML = `<span class="tc">${fmt(s.t)}</span><span class="nm">${s.name}</span><span class="nt">${s.note}</span>`;
    b.addEventListener('click', () => { v.currentTime = s.t + 0.01; v.play().catch(() => {}); });
    li.appendChild(b); list.appendChild(li);
    return b;
  });
  let active = -1;
  const sync = () => {
    let i = 0;
    SCENES.forEach((s, k) => { if (v.currentTime >= s.t) i = k; });
    if (i === active) return;
    if (active >= 0) btns[active].removeAttribute('aria-current');
    btns[i].setAttribute('aria-current', 'true');
    active = i;
  };
  v.addEventListener('timeupdate', sync);
  sync();
})();
</script>
